<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="assets/j-mark.svg">
<link rel="preload" href="assets/fonts/Agrandir-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/fonts/Aileron-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<title>Contact | Jungle.</title>
<meta name="description" content="Jungle is a design-led creative agency: ad creative, social, motion, web, copy and AI services for brands and marketing teams.">
</head>
<body data-page="contact">
<header class="ph">
  <h1 class="x words">Got a brief? Let's make it.</h1>
  <div class="intro">
    <p class="lead">Tell us what you need and when. We reply within one working day.</p>
    <div style="font-size:15px;line-height:1.9"><a href="mailto:ronij.jungle@gmail.com">ronij.jungle@gmail.com</a><br><a href="https://designbyjungle.com">designbyjungle.com</a><br><a href="https://instagram.com/jungledesigns">@jungledesigns</a></div>
  </div>
</header>
<section class="inv pad sec" style="position:relative">
  <span class="sticker" style="right:var(--gut);top:-20px">Now booking</span>
  <form id="brief" novalidate>
    <fieldset class="field" style="border:0"><legend class="label" style="margin-bottom:14px;color:var(--stone)">What do you need?</legend>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="Need" value="Creative design">Creative design</label>
        <label class="chip"><input type="checkbox" name="Need" value="Motion and video">Motion and video</label>
        <label class="chip"><input type="checkbox" name="Need" value="Web and digital">Web and digital</label>
        <label class="chip"><input type="checkbox" name="Need" value="Copy and campaigns">Copy and campaigns</label>
        <label class="chip"><input type="checkbox" name="Need" value="AI services">AI services</label>
        <label class="chip"><input type="checkbox" name="Need" value="Not sure yet">Not sure yet</label>
      </div></fieldset>
    <div class="two">
      <div class="field"><label for="f-name">Your name</label><input id="f-name" name="Name" autocomplete="name" required></div>
      <div class="field"><label for="f-co">Company or team</label><input id="f-co" name="Company" autocomplete="organization"></div>
    </div>
    <div class="two">
      <div class="field"><label for="f-mail">Email</label><input id="f-mail" type="email" name="Email" autocomplete="email" required><small class="err" id="f-err" role="alert" hidden>Add your name and a valid email so we can reply.</small></div>
      <div class="field"><label for="f-date">Deadline</label><input id="f-date" name="Deadline" placeholder="For example, end of June"></div>
    </div>
    <div class="field"><label for="f-brief">The brief</label><textarea id="f-brief" name="Brief" placeholder="What it's for, the formats you need, and anything we should know."></textarea><small>Sending opens your email app with the brief filled in.</small></div>
    <button class="btn" type="submit">Send brief <span aria-hidden="true">→</span></button>
  </form>
</section>
<script src="assets/data.js"></script><script src="assets/work/manifest.js?v=1791388775"></script><script src="assets/site.js"></script></body></html>
